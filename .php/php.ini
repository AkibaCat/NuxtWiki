; NuxtWiki 本地 PHP 开发配置（仅用于本地开发/测试）
; 生产环境（Kangle）请使用服务器自带 PHP 配置，仅需启用 pdo_mysql / mbstring / fileinfo 等

[PHP]
; 注意：本文件的 extension_dir 为「本机」路径，各设备可能不同，请按需改为本机 PHP 的 ext 目录。
; 可用命令查看当前值：
; Linux&MacOS : php -i | grep extension_dir
; Windows : php -i | findstr extension_dir
extension_dir = ""

extension = pdo_sqlite
extension = sqlite3
extension = pdo_mysql
extension = mbstring
extension = gd
extension = fileinfo
extension = openssl
extension = curl
extension = zip

error_reporting = E_ALL
display_errors = On
log_errors = On

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

upload_max_filesize = 32M
post_max_size = 40M