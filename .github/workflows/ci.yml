name: ci

on: push

jobs:
  # 代码检查：Lint + Typecheck + PHP 语法检查
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: PHP 语法检查
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

  # 构建部署包：静态前端 + PHP 后端 → 打包为 tar.gz
  build-package:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install

      - name: 生成静态前端
        run: pnpm generate

      - name: 组装部署包
        run: |
          # 前端：nuxt generate 产物（含 index.html、_nuxt、_fonts、.htaccess）复制到 dist 根
          mkdir -p dist
          cp -r .output/public/. dist/
          # 后端：整个 api 目录复制到 dist/api
          cp -r api dist/api
          # 移除安装向导生成 / 本地测试文件（config.php、data、uploads 由安装时自动创建）
          rm -rf dist/api/config.php dist/api/data dist/api/uploads
          rm -f dist/api/_seed_test.php dist/api/_smoke.php
          # 生成 tar.gz，便于服务器直接解压到站点根目录
          cd dist && tar -czf ../nuxtwiki-deploy.tar.gz . && cd ..
