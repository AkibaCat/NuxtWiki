name: ci

on: push

jobs:
  # 代码检查：Lint + Typecheck + PHP 语法检查
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: PHP 语法检查
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

  # 构建部署包：复用 build-deploy.sh（静态前端 + PHP 后端 → tar.gz，压缩包内直接是产物）
  build-package:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 运行构建打包脚本
        run: bash ./build-deploy.sh

      - name: 上传部署包
        uses: actions/upload-artifact@v4
        with:
          name: nuxtwiki-deploy
          path: deploy/*.tar.gz
